name: Selenium Java

on:
  push:
    branches: [main]
    paths:
      - 'java-tests/**'
      - '.github/workflows/selenium-java.yml'
  pull_request:
    branches: [main]
    paths:
      - 'java-tests/**'
      - '.github/workflows/selenium-java.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: java-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java-tests/pom.xml

      - name: Run checkout tests in Chrome
        run: mvn -B -ntp test

      - name: Upload Java checkout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-java-checkout-evidence
          path: |
            java-tests/target/evidence/
            java-tests/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 30
